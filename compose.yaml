name: profitflow

services:
    postgres:
        image: postgres:17-alpine
        container_name: profitflow-postgres
        environment:
            POSTGRES_DB: ${DB_DATABASE:-profitflow}
            POSTGRES_USER: ${DB_USERNAME:-profitflow}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-profitflow}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - profitflow_postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-profitflow} -d ${DB_DATABASE:-profitflow}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: profitflow-redis
        command: redis-server --appendonly yes
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - profitflow_redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
        restart: unless-stopped

volumes:
    profitflow_postgres_data:
        name: profitflow-postgres-data
    profitflow_redis_data:
        name: profitflow-redis-data
